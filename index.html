<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文件管理</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#1b2333;--mute:#6b7488;--line:#dde2ec;--acc:#2f5bea;--acc-ink:#fff;--hov:#f3f6fd;--sel:#e4ebff;--danger:#d23b3b;--folder:#e9a93a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--panel:#192030;--ink:#e6eaf3;--mute:#8d97ad;--line:#2a3347;--acc:#6f93ff;--acc-ink:#10141d;--hov:#202941;--sel:#26335a;--danger:#ff7676;--folder:#e9b04f}}
:root[data-theme="dark"]{--bg:#10141d;--panel:#192030;--ink:#e6eaf3;--mute:#8d97ad;--line:#2a3347;--acc:#6f93ff;--acc-ink:#10141d;--hov:#202941;--sel:#26335a;--danger:#ff7676;--folder:#e9b04f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;letter-spacing:.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.dng{color:var(--danger)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.search{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px;color:var(--mute);font-size:14px}
.crumbs button{background:none;border:0;cursor:pointer;color:var(--acc);padding:2px 4px;border-radius:4px}
.crumbs button:last-child{color:var(--ink);cursor:default}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.head,.row{display:grid;grid-template-columns:32px 1fr 90px 130px 110px;gap:8px;align-items:center;padding:9px 14px}
.head{color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hov)}
.row.sel{background:var(--sel)}
.name{display:flex;align-items:center;gap:10px;min-width:0}
.name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;width:30px;height:24px;border-radius:5px;background:var(--mute);color:var(--panel);font-size:10px;font-weight:700;display:grid;place-items:center;overflow:hidden}
.ic.f{background:var(--folder);color:#3a2a05}
.ic.img{background:#3aa57a}.ic.doc{background:#2f5bea}.ic.zip{background:#8a5cd6}.ic.vid{background:#d2593b}
.mut{color:var(--mute);font-size:13px}
.acts{display:flex;gap:2px;justify-content:flex-end}
.acts button{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
.acts button:hover{background:var(--line);color:var(--ink)}
.empty{padding:56px 20px;text-align:center;color:var(--mute)}
.drop{position:absolute;inset:0;background:color-mix(in srgb,var(--acc) 14%,transparent);border:2px dashed var(--acc);border-radius:12px;display:none;place-items:center;font-weight:600;color:var(--acc);z-index:5}
.box.over .drop{display:grid}
.status{margin-top:10px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,14,24,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.dh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{padding:16px;overflow:auto;max-height:68vh}
.db img,.db video{max-width:100%;max-height:60vh;display:block;margin:auto}
.db audio{width:100%}
.db pre{margin:0;white-space:pre-wrap;word-break:break-all;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.db input{width:100%;border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:8px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:640px){.head,.row{grid-template-columns:28px 1fr 74px}.c-date,.c-act-h{display:none}.row .acts{grid-column:2 / 4;justify-content:flex-start}.head .c-act-h{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <h1>文件管理</h1>
  <div class="bar">
    <button class="btn pri" id="up">上传文件</button>
    <button class="btn" id="mk">新建文件夹</button>
    <input class="search" id="q" type="search" placeholder="搜索全部文件" aria-label="搜索文件">
    <select class="btn" id="sort" aria-label="排序">
      <option value="name">按名称</option><option value="date">按时间</option><option value="size">按大小</option>
    </select>
    <button class="btn dng" id="delSel" hidden>删除所选</button>
    <input type="file" id="file" multiple hidden>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div class="box" id="box">
    <div class="head"><input type="checkbox" id="all" aria-label="全选"><span>名称</span><span>大小</span><span class="c-date">修改时间</span><span class="c-act-h"></span></div>
    <div id="list"></div>
    <div class="drop">松开鼠标，上传到当前文件夹</div>
  </div>
  <div class="status"><span id="count"></span><span>文件保存在本机浏览器中，不会上传到服务器</span></div>
</div>

<dialog id="dlg"><div class="dh"><b id="dt"></b><button class="btn" id="dx">关闭</button></div><div class="db" id="dbody"></div><div class="df" id="dfoot"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let items=[],cwd=null,sel=new Set(),db=null;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const mem=!window.indexedDB;

/* 存储：IndexedDB，不可用时仅保存在内存 */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('fm-site',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbAll(){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}
function dbPut(o){try{db&&db.transaction('items','readwrite').objectStore('items').put(o)}catch(e){}}
function dbDel(id){try{db&&db.transaction('items','readwrite').objectStore('items').delete(id)}catch(e){}}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const fdate=t=>new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const kids=id=>items.filter(i=>i.parent===id);
function size(i){return i.type==='dir'?kids(i.id).reduce((s,c)=>s+size(c),0):i.size}
function ext(n){const m=n.match(/\.([^.]+)$/);return m?m[1].toLowerCase():''}
function kind(i){if(i.type==='dir')return['f','夹'];const e=ext(i.name);
 if(/^(png|jpe?g|gif|webp|svg|bmp)$/.test(e))return['img',e];
 if(/^(mp4|mov|webm|mkv|mp3|wav|ogg|m4a)$/.test(e))return['vid',e];
 if(/^(zip|rar|7z|tar|gz)$/.test(e))return['zip',e];
 if(/^(pdf|docx?|xlsx?|pptx?|txt|md)$/.test(e))return['doc',e];
 return['',e||'文件']}

function render(){
 const q=$('#q').value.trim().toLowerCase();
 let rows=q?items.filter(i=>i.name.toLowerCase().includes(q)):kids(cwd);
 const s=$('#sort').value;
 rows.sort((a,b)=>(a.type==='dir'?0:1)-(b.type==='dir'?0:1)||(s==='name'?a.name.localeCompare(b.name,'zh'):s==='date'?b.date-a.date:size(b)-size(a)));
 // 面包屑
 const path=[];for(let c=cwd;c;){const n=items.find(i=>i.id===c);if(!n)break;path.unshift(n);c=n.parent}
 const cr=$('#crumbs');cr.innerHTML='';
 const add=(label,id,last)=>{const b=document.createElement('button');b.textContent=label;if(!last)b.onclick=()=>go(id);cr.appendChild(b)};
 add('全部文件',null,!path.length&&!q);path.forEach((p,i)=>{cr.append('/');add(p.name,p.id,i===path.length-1&&!q)});
 if(q)cr.append(' 搜索结果');
 const L=$('#list');L.innerHTML='';
 if(!rows.length){L.innerHTML='<div class="empty">'+(q?'没有找到匹配的文件':'这个文件夹是空的。点击“上传文件”，或把文件拖到这里。')+'</div>'}
 rows.forEach(i=>{
  const [c,l]=kind(i);const r=document.createElement('div');r.className='row'+(sel.has(i.id)?' sel':'');r.tabIndex=0;
  r.innerHTML=`<input type="checkbox" ${sel.has(i.id)?'checked':''} aria-label="选择"><div class="name"><span class="ic ${c}">${esc(l.slice(0,4))}</span><span class="t">${esc(i.name)}</span></div><span class="mut">${i.type==='dir'?kids(i.id).length+' 项':fmt(i.size)}</span><span class="mut c-date">${fdate(i.date)}</span><div class="acts"><button data-a="ren">重命名</button>${i.type==='file'?'<button data-a="dl">下载</button>':''}<button data-a="del">删除</button></div>`;
  r.querySelector('input').onclick=e=>{e.stopPropagation();sel.has(i.id)?sel.delete(i.id):sel.add(i.id);render()};
  r.querySelector('.acts').onclick=e=>{e.stopPropagation();const a=e.target.dataset.a;if(a==='ren')rename(i);if(a==='dl')download(i);if(a==='del')remove([i.id])};
  const open=()=>i.type==='dir'?go(i.id):preview(i);
  r.onclick=open;r.onkeydown=e=>{if(e.key==='Enter')open()};
  L.appendChild(r)});
 $('#delSel').hidden=!sel.size;$('#delSel').textContent='删除所选 ('+sel.size+')';
 $('#all').checked=rows.length>0&&rows.every(i=>sel.has(i.id));$('#all').onclick=e=>{rows.forEach(i=>e.target.checked?sel.add(i.id):sel.delete(i.id));render()};
 const files=items.filter(i=>i.type==='file');
 $('#count').textContent='共 '+files.length+' 个文件，'+fmt(files.reduce((s,f)=>s+f.size,0));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(id){cwd=id;sel.clear();$('#q').value='';render()}

function addFiles(fl){
 let n=0;[...fl].forEach(f=>{const o={id:uid(),parent:cwd,type:'file',name:f.name,size:f.size,mime:f.type,date:f.lastModified||Date.now(),blob:f};items.push(o);dbPut(o);n++});
 if(n){toast('已上传 '+n+' 个文件');render()}
}
function remove(ids){
 const all=new Set();const walk=id=>{all.add(id);kids(id).forEach(k=>walk(k.id))};ids.forEach(walk);
 if(!confirm('确定删除 '+ids.length+' 项吗？文件夹内的内容也会一并删除。'))return;
 items=items.filter(i=>!all.has(i.id));all.forEach(dbDel);sel.clear();render();toast('已删除')
}
function download(i){const u=URL.createObjectURL(i.blob);const a=document.createElement('a');a.href=u;a.download=i.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* 对话框 */
const dlg=$('#dlg');let urlToFree=null;
function show(title,body,foot){$('#dt').textContent=title;const b=$('#dbody');b.innerHTML='';b.append(body);const f=$('#dfoot');f.innerHTML='';(foot||[]).forEach(x=>f.append(x));f.style.display=foot&&foot.length?'flex':'none';dlg.showModal()}
dlg.addEventListener('close',()=>{if(urlToFree){URL.revokeObjectURL(urlToFree);urlToFree=null}$('#dbody').innerHTML=''});
$('#dx').onclick=()=>dlg.close();
function btn(t,cls,fn){const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;return b}
function ask(title,val,okText,cb){
 const inp=document.createElement('input');inp.value=val||'';inp.placeholder='名称';
 const go=()=>{const v=inp.value.trim().replace(/[\/\\]/g,'');if(!v){inp.focus();return}dlg.close();cb(v)};
 inp.onkeydown=e=>{if(e.key==='Enter')go()};
 show(title,inp,[btn('取消','',()=>dlg.close()),btn(okText,'pri',go)]);inp.focus();inp.select()
}
function rename(i){ask('重命名',i.name,'保存',v=>{i.name=v;i.date=Date.now();dbPut(i);render();toast('已重命名')})}
function preview(i){
 const e=ext(i.name),m=i.mime||'';let node;
 if(m.startsWith('image/')||/^(png|jpe?g|gif|webp|svg|bmp)$/.test(e)||m.startsWith('video/')||m.startsWith('audio/')){
  urlToFree=URL.createObjectURL(i.blob);
  node=document.createElement(m.startsWith('video/')?'video':m.startsWith('audio/')?'audio':'img');node.src=urlToFree;if(node.tagName!=='IMG')node.controls=true;
  show(i.name,node,[btn('下载','pri',()=>download(i))])
 }else if((m.startsWith('text/')||/^(txt|md|json|js|css|html|csv|xml|log|py|ts|yml|yaml)$/.test(e))&&i.size<2e6){
  node=document.createElement('pre');node.textContent='加载中…';show(i.name,node,[btn('下载','pri',()=>download(i))]);
  i.blob.text().then(t=>node.textContent=t)
 }else{
  node=document.createElement('div');node.innerHTML='<p>此类型暂不支持预览。</p><p class="mut">大小：'+fmt(i.size)+'<br>修改时间：'+fdate(i.date)+'</p>';
  show(i.name,node,[btn('下载','pri',()=>download(i))])
 }
}

/* 事件 */
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#mk').onclick=()=>ask('新建文件夹','','创建',v=>{const o={id:uid(),parent:cwd,type:'dir',name:v,date:Date.now()};items.push(o);dbPut(o);render()});
$('#delSel').onclick=()=>remove([...sel]);
$('#q').oninput=render;$('#sort').onchange=render;
const box=$('#box');let dc=0;
box.addEventListener('dragenter',e=>{e.preventDefault();dc++;box.classList.add('over')});
box.addEventListener('dragover',e=>e.preventDefault());
box.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;box.classList.remove('over')}});
box.addEventListener('drop',e=>{e.preventDefault();dc=0;box.classList.remove('over');if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

(async()=>{await openDB();items=await dbAll();render()})();
</script>
</body>
</html>
